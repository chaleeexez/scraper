name: Scrape Thaiwater Data

on:
  schedule:
    - cron: '0 * * * *'  # ตั้งเวลารันอัตโนมัติทุกๆ 1 ชั่วโมง
  workflow_dispatch:     # อนุญาตให้กดปุ่มสั่งรันเองได้แบบ Manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push updated CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add thaiwater_rainfall_live.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update rainfall data" && git push)
