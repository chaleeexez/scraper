name: Fetch Dam Data

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-dam-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Dam Data
        run: |
          HTTP_STATUS=$(curl -s -o dam_data.tmp.json -w "%{http_code}" \
            --retry 3 --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Referer: https://www.thaiwater.net/" \
            -H "Accept: application/json, text/plain, */*" \
            "https://api-v3.thaiwater.net/api/v1/thaiwater30/analyst/dam")

          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] && jq empty dam_data.tmp.json 2>/dev/null; then
            mv dam_data.tmp.json dam_data.json
            echo "Data fetched successfully."
          else
            echo "Failed to fetch data (Status $HTTP_STATUS), skipping update."
            rm -f dam_data.tmp.json
            exit 0
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dam_data.json
          git commit -m "Auto update dam data $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git pull --rebase
          git push
