name: Fetch Dam Data

on:
  schedule:
    - cron: '0 1 * * *' # รันวันละ 1 ครั้ง ตอน 08:00 น. ไทย (01:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-dam-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Dam Data
        run: |
          curl -sf -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/dam_daily" \
            -o dam_data.tmp.json
          jq empty dam_data.tmp.json
          mv dam_data.tmp.json dam_data.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dam_data.json
          git commit -m "Auto update dam data $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git pull --rebase
          git push
